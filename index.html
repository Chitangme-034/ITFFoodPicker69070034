<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Picker ITF</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <span class="student-id">69070034</span>
        <h1>FOODPICKER ITF</h1>
        <span class="week">Week 15</span>
    </nav>

    <!-- Main Content -->
    <main class="container">

        <!-- Food Card -->
        <section class="food-card">

            <div class="food-image-container">
                <img
                    id="foodImage"
                    src="KimchiFriedRice.jpg"
                    alt="Kimchi Fried Rice"
                >
            </div>

            <div class="food-info">


                <h2 id="foodName">Kimchi Fried Rice</h2>

                <p id="foodDescription">
                    Korean fried rice cooked with spicy kimchi.
                </p>

                <p class="food-price" id="foodPrice">
                    Price: 120 Baht
                </p>

            </div>

        </section>

        <!-- Random Button -->
        <button
            type="button"
            id="randomButton"
            class="random-button"
        >
            <span>Random Food</span>
            <span class="button-icon">↻</span>
        </button>
    </main>

</body>
<script src="script.js"></script>
</html>
